name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build self-signable IPA
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA for personal signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build
          bash ios/build-ipa.sh 2>&1 | tee ios/build/build.log
      - name: Record IPA checksum
        shell: bash
        working-directory: ios/build
        run: |
          shasum -a 256 Reader-unsigned.ipa > Reader-unsigned.ipa.sha256
          cat Reader-unsigned.ipa.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Reader-unsigned-IPA
          path: |
            ios/build/Reader-unsigned.ipa
            ios/build/Reader-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-log
          path: ios/build/build.log
          if-no-files-found: ignore
