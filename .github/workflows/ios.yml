name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ['codex/ios-reader']
    paths: ['ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build self-signable IPA
    runs-on: macos-15-intel
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA for personal signing
        shell: bash
        run: |
          set -euo pipefail
          bash ios/build-ipa.sh
      - name: Record IPA checksum
        shell: bash
        working-directory: ios/build
        run: |
          shasum -a 256 Reader-unsigned.ipa > Reader-unsigned.ipa.sha256
          cat Reader-unsigned.ipa.sha256 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA to a draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ios-v0.1.0
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > /tmp/reader-release.json; then
            python3 - <<'PY'
          import json
          with open('/tmp/reader-release.json') as source:
              release = json.load(source)
          if release['isDraft'] is not True:
              raise SystemExit('Refusing to upload the IPA to a published Release.')
          PY
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --prerelease \
              --title '阅间 iOS v0.1.0（自签 IPA）' \
              --notes-file ios/RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --notes-file ios/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            ios/build/Reader-unsigned.ipa ios/build/Reader-unsigned.ipa.sha256
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
