name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'tests/fixtures/reader_site.py', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'tests/fixtures/reader_site.py', '.github/workflows/ios.yml']

permissions:
  contents: read

jobs:
  build:
    name: iOS (${{ matrix.device }})
    runs-on: macos-15-intel
    timeout-minutes: 30
    concurrency:
      group: ios-${{ github.ref }}-${{ matrix.device }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: python3 ios/generate_project.py
      - name: Start controlled API fixture for native UI tests
        run: |
          python3 tests/fixtures/reader_site.py --mobile-api --port 18998 > /tmp/reader-ui-fixture.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:18998/__state', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('UI fixture failed to start')
          PY
      - name: Select an installed simulator
        id: simulator
        shell: bash
        env:
          DEVICE_KIND: ${{ matrix.device }}
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys,os; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if ".iOS-" in runtime for x in devices if x["name"].startswith(os.environ["DEVICE_KIND"])))')
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run native iOS tests
        run: |
          mkdir -p ios/build
          xcodebuild test -project ios/Reader.xcodeproj -scheme Reader \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -parallel-testing-enabled NO \
            -derivedDataPath ios/.build -resultBundlePath ios/build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee ios/build/native-test.log
      - name: Publish actionable test failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          def annotation(message):
              message = str(message).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message[:12000])
          log = Path('ios/build/native-test.log')
          if log.exists():
              lines = [line for line in log.read_text(errors='replace').splitlines()
                       if re.search(r'error:|XCTAssert|failed -|failed to|Testing failed|Test Case .*failed', line, re.I)]
              for line in list(dict.fromkeys(lines))[-12:]:
                  annotation(line)
          bundle = Path('ios/build/TestResults.xcresult')
          if bundle.exists():
              result = subprocess.run(['xcrun', 'xcresulttool', 'get', 'test-results', 'summary', '--path', str(bundle)], capture_output=True, text=True)
              if result.returncode == 0:
                  Path('ios/build/TestSummary.json').write_text(result.stdout)
                  summary = json.loads(result.stdout)
                  for failure in summary.get('testFailures', []):
                      annotation(json.dumps(failure, ensure_ascii=False))
          PY
      - name: Build unsigned IPA for personal signing
        if: matrix.device == 'iPhone'
        run: bash ios/build-ipa.sh
      - name: Verify unit and UI tests executed
        shell: bash
        run: |
          xcrun xcresulttool get test-results summary --path ios/build/TestResults.xcresult > ios/build/TestSummary.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path('ios/build/TestSummary.json').read_text())
          passed = summary['passedTests']
          failed = summary['failedTests']
          assert passed >= 7 and failed == 0, summary
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write(f'Native iOS tests: **{passed} passed, {failed} failed**.\n\n')
          PY
      - name: Record IPA checksum
        if: matrix.device == 'iPhone'
        run: |
          shasum -a 256 ios/build/Reader-unsigned.ipa > ios/build/Reader-unsigned.ipa.sha256
          cat ios/build/Reader-unsigned.ipa.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.device == 'iPhone'
        with:
          name: Reader-unsigned-IPA
          path: |
            ios/build/Reader-unsigned.ipa
            ios/build/Reader-unsigned.ipa.sha256
            ios/build/TestSummary.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload simulator results and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results-${{ matrix.device }}
          path: |
            ios/build/TestResults.xcresult
            ios/build/TestSummary.json
            ios/build/native-test.log
          if-no-files-found: ignore
